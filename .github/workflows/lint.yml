name: Lint & Code Style

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Client Code Style
        run: |
          if [ -d "client" ]; then
            cd client
            npm ci
            npm run lint --if-present
          fi

      - name: Check Server Code Style
        run: |
          if [ -d "server" ]; then
            cd server
            npm ci
            npm run lint --if-present
          fi
